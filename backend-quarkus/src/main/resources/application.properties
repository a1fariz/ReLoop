# ============ Application ============
quarkus.application.name=reloop-backend-quarkus
quarkus.http.port=8080
quarkus.shutdown.timeout=30S

# ============ Datasource (defaults match docker-compose.yml: reloop-postgres on host port 5433) ============
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:reloop_app}
quarkus.datasource.password=${DB_PASSWORD:reloop_secret_password}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:reloop_db}${DB_PARAMS:}
# Neon/managed Postgres require TLS; local docker postgres does not — set
# DB_PARAMS=?sslmode=require (and this flag true) only for cloud deployments.
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=${DB_SSLMODE:prefer}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=20M
quarkus.datasource.jdbc.leak-detection-interval=2M

# ============ Hibernate / Flyway (schema owned by Flyway V1..V8, identical to legacy backend) ============
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
# Map camelCase entity fields to the snake_case Flyway schema
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true
# No baseline: fresh databases (CI Testcontainers, cloud deploys) must run the full V1..V18 chain.
# Local dev DBs bootstrapped by the legacy Spring backend already own a flyway_schema_history.
quarkus.flyway.locations=classpath:db/migration

# ============ Security ============
# HS256 access token signing key (>= 32 bytes). MUST be overridden via env in real deployments.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-ID
quarkus.http.cors.exposed-headers=X-Correlation-ID
quarkus.http.cors.access-control-allow-credentials=true

# Public API surface mirrors the legacy SecurityConfig permitAll rules.
# Everything else requires an authenticated SecurityIdentity; admin-only rules
# are enforced with @RolesAllowed on the resource methods.
quarkus.http.auth.permission.public.paths=/api/v1/auth/*,/api/v1/catalog/*,/api/v1/listings/*,/api/v1/trade-in/*,/api/v1/sellers/*,/api/v1/reviews/*,/q/health/*,/q/swagger-ui/*,/q/openapi,/q/metrics,/actuator/health
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Listing writes must be authenticated even though the legacy GET surface is public
# (ties with the public set -> both policies must pass -> authenticated required).
quarkus.http.auth.permission.listings-write.paths=/api/v1/listings/*
quarkus.http.auth.permission.listings-write.methods=POST,PATCH
quarkus.http.auth.permission.listings-write.policy=authenticated
# Trade-in intake (POST /requests, GET /requests/my) is user-scoped; only
# POST /calculate stays public from the legacy surface.
quarkus.http.auth.permission.tradein-write.paths=/api/v1/trade-in/requests,/api/v1/trade-in/requests/*
quarkus.http.auth.permission.tradein-write.methods=POST,GET
quarkus.http.auth.permission.tradein-write.policy=authenticated
# Review submission is buyer-scoped; reading a seller's reviews stays public.
quarkus.http.auth.permission.reviews-write.paths=/api/v1/reviews
quarkus.http.auth.permission.reviews-write.methods=POST
quarkus.http.auth.permission.reviews-write.policy=authenticated
# Payment gateway webhook: exact path is more specific than /api/*, so this
# public rule wins for the webhook only (longest-path-wins semantics); the
# handler itself is idempotent on terminal statuses.
quarkus.http.auth.permission.webhook.paths=/api/v1/payments/webhook
quarkus.http.auth.permission.webhook.methods=POST
quarkus.http.auth.permission.webhook.policy=permit

# Prod lockdown: /q/metrics, /q/swagger-ui, /q/openapi require auth in prod
# (ties with the public set above, so the stricter policy wins there).
%prod.quarkus.http.auth.permission.admin-ui.paths=/q/metrics,/q/swagger-ui/*,/q/openapi
%prod.quarkus.http.auth.permission.admin-ui.policy=authenticated

# ============ Redis (cache + login rate limiting) ============
quarkus.redis.hosts=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
reloop.cache.catalog-ttl-seconds=${CATALOG_CACHE_TTL_SECONDS:300}
reloop.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX:10}
reloop.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# ============ Outbox dispatch: LOG (legacy behaviour) | KAFKA (real publish) ============
reloop.outbox.dispatch=${OUTBOX_DISPATCH_MODE:LOG}
mp.messaging.outgoing.reloop-events.connector=smallrye-kafka
mp.messaging.outgoing.reloop-events.topic=reloop-domain-events
mp.messaging.outgoing.reloop-events.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.reloop-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Don't auto-start a Kafka DevServices container in dev (use docker-compose.kafka.yml explicitly)
quarkus.kafka.devservices.enabled=false
# Outbox Kafka channel: don't fail health checks when no broker is configured (LOG dispatch mode)
mp.messaging.outgoing.reloop-events.health-enabled=false

# ============ Mail (delivers outbox EMAIL_* events; Mailpit in dev, UI at :8025) ============
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.from=${SMTP_FROM:no-reply@reloop.com}
reloop.mail.enabled=${MAIL_ENABLED:true}

# ============ Health / Metrics / OpenAPI ============
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Legacy actuator compatibility (gateway nginx.conf routes /actuator/health)
quarkus.http.non-application-root-path=/q

# ============ Logging ============
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{36} [corr_id=%X{correlationId}] - %s%e%n
quarkus.log.category."com.reloop".level=DEBUG
quarkus.log.category."org.flywaydb".level=INFO
