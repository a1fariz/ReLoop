name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-quarkus:
    name: Quarkus backend (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & verify (Testcontainers ITs run here; Docker is preinstalled)
        working-directory: backend-quarkus
        run: mvn -B verify

  backend-legacy:
    name: Legacy Spring backend (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        working-directory: backend
        run: mvn -B test
