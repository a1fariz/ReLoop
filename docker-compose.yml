services:
  reloop-gateway:
    image: nginx:alpine
    container_name: reloop-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - reloop-postgres
      - reloop-redis

  reloop-postgres:
    image: postgres:16-alpine
    container_name: reloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reloop_db
      POSTGRES_USER: reloop_app
      POSTGRES_PASSWORD: reloop_secret_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloop_app -d reloop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  reloop-redis:
    image: redis:7-alpine
    container_name: reloop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  reloop-mailpit:
    image: axllent/mailpit:latest
    container_name: reloop-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  # Quarkus backend container (legacy Spring Boot backend/ runs on the host instead).
  # Build first:  docker compose build reloop-backend
  reloop-backend:
    build:
      context: .
      dockerfile: backend-quarkus/Dockerfile
    image: reloop-backend-quarkus:latest
    container_name: reloop-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: reloop-postgres
      DB_PORT: "5432"
      DB_USER: reloop_app
      DB_PASSWORD: reloop_secret_password
      REDIS_HOST: reloop-redis
      SMTP_HOST: reloop-mailpit
      SMTP_PORT: "1025"
      # OUTBOX_DISPATCH_MODE: KAFKA  # enable with docker-compose.kafka.yml
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env}
    depends_on:
      reloop-postgres:
        condition: service_healthy
      reloop-redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
